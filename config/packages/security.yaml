security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Espace admin
        - { path: ^/dashboard, roles: ROLE_ADMIN }
        - { path: ^/category, roles: ROLE_ADMIN }
        - { path: ^/message, roles: ROLE_ADMIN }
        - { path: ^/newsletter, roles: ROLE_ADMIN }
        - { path: ^/order, roles: ROLE_ADMIN }
        - { path: ^/user, roles: ROLE_ADMIN }
        - { path: ^/product/new, roles: ROLE_ADMIN }
        - { path: ^/product/\d+/edit, roles: ROLE_ADMIN }
        - { path: ^/product/\d+$, roles: ROLE_ADMIN, methods: [POST] }

        # Espace utilisateur connecté
        - { path: ^/commande, roles: ROLE_USER }
        - { path: ^/commande-panier, roles: ROLE_USER }
        - { path: ^/commander, roles: ROLE_USER }
        - { path: ^/mes-commandes, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
